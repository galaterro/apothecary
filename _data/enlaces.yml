# ═══════════════════════════════════════════════════════════════════════
#  ENLACES DE LA WEB DE APOTHECARY
# ═══════════════════════════════════════════════════════════════════════
#
#  Este es el ÚNICO archivo que hay que tocar para cambiar la web.
#  Los botones salen en el mismo orden en que están escritos aquí abajo.
#
#  Cada enlace es un bloque que empieza por un guion (-):
#
#    - titulo: Spotify                      ← texto del botón
#      url: https://open.spotify.com/...    ← adónde lleva
#      subtitulo: Nuestro primer EP         ← (opcional) texto pequeño debajo
#      destacado: true                      ← (opcional) botón resaltado, p. ej. un estreno
#      icono: entradas                      ← (opcional) normalmente se elige solo
#
#  Para no romper nada:
#    · Respeta los espacios del principio de cada línea. "titulo" va justo
#      después del guion y las demás líneas del bloque, alineadas con él.
#    · Si un texto lleva dos puntos (:) o empieza por un símbolo,
#      ponlo entre comillas:   subtitulo: "Directo: Sala Live, Madrid"
#    · Para ocultar un enlace sin borrarlo, pon "# " al principio de sus
#      líneas. Para volver a mostrarlo, quita el "# " (almohadilla y espacio).
#
#  El icono se elige solo según la web del enlace (YouTube, Instagram,
#  Spotify, TikTok, Bandcamp, Apple Music, SoundCloud, WhatsApp, webs de
#  entradas...). Para forzar uno, añade "icono:" con alguno de estos:
#    entradas, conciertos, tienda, correo, web, musica, enlace
#
#  Para un correo basta con poner la dirección:   url: apothecary@gmail.com
#
#  Tras guardar ("Commit changes"), la web se actualiza sola en 1-2 minutos.
# ═══════════════════════════════════════════════════════════════════════

